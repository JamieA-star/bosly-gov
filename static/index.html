<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BOSLY GOV</title>
  <meta name="color-scheme" content="dark" />
  <style>
    :root {
      --bg: #050505;
      --card: #0a0a0a;
      --card-2: #111111;
      --text: #f5f5f5;
      --muted: #b3b3b3;
      --line: #1d1d1d;
      --accent: #a78bfa;
      --accent-soft: rgba(167, 139, 250, 0.18);
      --radius: 1rem;
      --ease: 150ms ease;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    .app {
      height: 100%;
      display: flex;
      flex-direction: column;
      max-width: 980px;
      margin: 0 auto;
      padding: 16px;
      gap: 12px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 16px;
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .status-dot {
      width: 10px; height: 10px; border-radius: 999px; background: #5a5a5a;
      transition: background var(--ease);
    }
    .status-dot.online { background: var(--accent); }
    .title { margin: 0; font-size: 1.05rem; font-weight: 600; letter-spacing: .01em; }
    .status-text { color: var(--muted); font-size: .95rem; }

    .tabs { display: flex; gap: 8px; }
    .btn {
      border: 1px solid var(--line);
      background: var(--card-2);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      transition: all var(--ease);
      font-size: .95rem;
    }
    .btn:hover { border-color: var(--accent); }
    .btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #e9e0ff;
    }

    .panel {
      flex: 1;
      min-height: 0;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .hidden { display: none !important; }

    .chat-area, .saved-area {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .message-row {
      display: flex;
      width: 100%;
    }
    .message-row.user { justify-content: flex-end; }
    .message-row.bosly, .message-row.system { justify-content: flex-start; }

    .message {
      max-width: min(85%, 780px);
      background: #101010;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 13px;
      position: relative;
    }
    .message-row.user .message {
      background: #121212;
      border-color: #2a2a2a;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: .82rem;
    }

    .star-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 2px;
      border-radius: 6px;
      transition: color var(--ease), background var(--ease);
    }
    .star-btn:hover { color: var(--accent); background: rgba(255,255,255,0.03); }
    .star-btn.saved { color: var(--accent); }

    .content { white-space: pre-wrap; word-wrap: break-word; }

    .thinking-card {
      background: #0f0f0f;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px;
    }
    .thinking-title { font-size: .95rem; color: #d9d1ff; margin-bottom: 8px; }
    .thinking-line { color: var(--muted); font-size: .92rem; display: flex; align-items: center; gap: 8px; }

    .dots { display: inline-flex; gap: 4px; }
    .dots span {
      width: 6px; height: 6px; border-radius: 999px; background: var(--accent);
      opacity: .45; animation: pulse 1.2s infinite ease-in-out;
    }
    .dots span:nth-child(2) { animation-delay: .15s; }
    .dots span:nth-child(3) { animation-delay: .3s; }

    @keyframes pulse { 0%, 80%, 100% { transform: scale(.8); opacity: .35; } 40% { transform: scale(1); opacity: 1; } }

    details.context-box {
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #0d0d0d;
      overflow: hidden;
    }
    details.context-box > summary {
      list-style: none;
      cursor: pointer;
      padding: 10px 12px;
      color: #d8d2ea;
      font-size: .9rem;
      outline: none;
    }
    details.context-box > summary::-webkit-details-marker { display: none; }
    .context-detail { padding: 0 12px 12px; color: var(--muted); font-size: .88rem; }

    .code-wrap {
      margin-top: 10px;
      background: #0b0b0f;
      border: 1px solid #26223a;
      border-radius: 12px;
      overflow: hidden;
    }
    .code-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 10px; border-bottom: 1px solid #26223a; color: #d7cef9; font-size: .82rem;
    }
    .copy-btn, .apply-btn {
      border: 1px solid #3a3357;
      background: transparent;
      color: #ddd2ff;
      border-radius: 999px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: .8rem;
      transition: all var(--ease);
      margin-left: 6px;
    }
    .copy-btn:hover, .apply-btn:hover { border-color: var(--accent); color: #f2eeff; }
    pre {
      margin: 0; padding: 12px;
      overflow: auto; font-size: .92rem;
      line-height: 1.45;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      color: #ece9ff;
    }

    .input-wrap {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px;
    }
    .form { display: flex; gap: 10px; align-items: flex-end; }
    textarea {
      flex: 1;
      min-height: 56px;
      max-height: 180px;
      resize: vertical;
      border: 1px solid var(--line);
      background: #0f0f0f;
      color: var(--text);
      border-radius: 14px;
      padding: 12px;
      font-size: 1rem;
      outline: none;
      transition: border-color var(--ease);
    }
    textarea:focus { border-color: var(--accent); }
    .send {
      border: 1px solid var(--accent);
      background: var(--accent-soft);
      color: #f1ebff;
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 1rem;
      cursor: pointer;
      transition: all var(--ease);
    }
    .send:disabled { opacity: .6; cursor: default; }

    .saved-empty { color: var(--muted); padding: 8px 4px; }

    @media (max-width: 640px) {
      .app { padding: 10px; }
      .message { max-width: 94%; }
      .status-text { display: none; }
      .title { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div id="statusDot" class="status-dot" aria-hidden="true"></div>
        <h1 class="title">Bosly Gov</h1>
      </div>
      <div id="projectTabs" class="project-tabs"></div>
      <div class="tabs">
        <button id="chatTabBtn" class="btn active" type="button">Chat</button>
        <button id="savedTabBtn" class="btn" type="button">Saved</button>
      </div>
      <div id="statusText" class="status-text" aria-live="polite">Connecting</div>
    </header>

    <section class="panel">
      <div id="reportPanel" class="report-modal hidden">
        <div class="report-modal-content">
          <div class="report-header">
            <span id="reportTitle" class="report-title"></span>
            <div class="report-actions">
              <button id="reportEditBtn" class="btn" type="button">Edit</button>
              <button id="reportNewBtn" class="btn" type="button">New Year</button>
              <button id="reportCloseBtn" class="btn" type="button">Close</button>
            </div>
          </div>
          <div id="reportView" class="report-view"></div>
          <div id="reportEdit" class="report-edit hidden">
            <textarea id="reportEditor" class="report-editor"></textarea>
            <div class="report-edit-actions">
              <button id="reportSaveBtn" class="btn approve" type="button">Save</button>
              <button id="reportCancelBtn" class="btn" type="button">Cancel</button>
            </div>
          </div>
        </div>
      </div>
      <div id="govStatus" class="gov-status"></div>

      <div id="govConsentCard" class="consent-card" style="display:none;">
        <h3>Approval required</h3>
        <div id="govConsentSummary" class="consent-summary"></div>
        <pre id="govConsentDiff" class="consent-diff"></pre>
        <div class="consent-actions">
          <button id="govApproveBtn" class="btn approve" type="button">Approve & Apply</button>
          <button id="govDenyBtn" class="btn deny" type="button">Deny</button>
          <button id="govResumeBtn" class="btn" type="button">Refresh</button>
        </div>
      </div>

      <div id="govTimeline" class="gov-timeline"></div>

      <div id="govMetricsBar" class="metrics-bar"></div>
      <div id="govContextFilesPanel" class="context-panel"></div>
      <div id="govSimilarPanel" class="similar-panel"></div>

      <div id="chatArea" class="chat-area" role="log" aria-live="polite" aria-relevant="additions"></div>
      <div id="savedArea" class="saved-area hidden"></div>
    </section>

    <footer class="input-wrap">
      <form id="chatForm" class="form" autocomplete="off">
        <textarea id="chatInput" placeholder="Ask Bosly Gov…" required></textarea>
        <button id="sendBtn" class="send" type="submit">Send</button>
      </form>
    </footer>
  </div>

  <script src="/gov/project.js?v=4"></script>
  <script src="/gov/app.js?v=9"></script>
</body>
</html>
