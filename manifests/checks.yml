# Bosly Gov check manifest.
#
# Declares which checks run in which tier for each project.
# Gov's runners/run_checks.py reads this file, runs the matching
# commands, aggregates results, writes JSON reports.
#
# Each check has:
#   id        - unique, dotted namespace (project.checkname)
#   severity  - critical | high | medium | low
#   command   - shell command to run, relative to the project root

projects:

  accord:
    root: /home/bosly_accord/bosly-1.0
    tiers:
      fast:
        - id: accord.invariants
          severity: high
          command: bash -lc 'source ~/.nvm/nvm.sh && npx tsx scripts/test-fast.ts'
      slow: []

  keep:
    root: /home/bosly_accord/bosly-keep
    tiers:
      fast:
        - id: keep.invariants
          severity: high
          command: bash scripts/run-tests.sh
      slow: []

  gov:
    root: /home/bosly_accord/bosly-gov
    tiers:
      fast:
        - id: gov.stub_detection
          severity: medium
          command: python3 checks/stub_detection.py
        - id: gov.naming_honesty
          severity: medium
          command: python3 checks/naming_honesty.py
        - id: gov.plan_tracks_known_gaps
          severity: medium
          command: python3 checks/plan_tracks_known_gaps.py
        - id: gov.memory_schema
          severity: high
          command: python3 checks/memory_schema.py
        - id: gov.next_md_tracks_plan
          severity: medium
          command: python3 checks/next_md_tracks_plan.py
        - id: gov.unanswered_in_the_pile
          severity: medium
          command: python3 checks/unanswered_in_the_pile.py
        - id: gov.tool_loop_selftest
          severity: high
          command: python3 routers/tool_loop.py
        - id: gov.accord_compliance
          severity: high
          command: python3 checks/accord_compliance.py
        - id: gov.public_routes_are_public
          severity: high
          command: python3 checks/public_routes_are_public.py
        - id: gov.paid_routes_gated
          severity: high
          command: python3 checks/paid_routes_gated.py
        - id: gov.email_password_plaintext
          severity: high
          command: python3 checks/email_password_plaintext.py
        - id: gov.tsconfig_excludes
          severity: high
          command: python3 checks/tsconfig_excludes.py
        - id: gov.claim_invariants
          severity: medium
          command: python3 checks/claim_invariants.py
        - id: gov.consent_gating
          severity: critical
          command: python3 checks/consent_gating.py
        - id: gov.secrets_audit
          severity: high
          command: python3 checks/secrets_audit.py
        - id: gov.cron_sanity
          severity: high
          command: python3 checks/cron_sanity.py
        - id: gov.orphaned_routes
          severity: medium
          command: python3 checks/orphaned_routes.py
        - id: gov.vault_plaintext_calendar
          severity: high
          command: python3 checks/vault_plaintext_calendar.py
        - id: gov.executive_proxy_no_db
          severity: high
          command: python3 checks/executive_proxy_no_db.py
        - id: gov.executive_proxy_gated
          severity: high
          command: python3 checks/executive_proxy_gated.py
        - id: gov.executive_proxy_managed_only
          severity: high
          command: python3 checks/executive_proxy_managed_only.py
        - id: gov.hasProduct_vault_false
          severity: high
          command: python3 checks/hasProduct_vault_false.py
        - id: gov.executive_proxy_live
          severity: high
          command: python3 checks/executive_proxy_live.py
        - id: gov.answer_cache_no_sensitive
          severity: high
          command: python3 checks/answer_cache_no_sensitive.py
        - id: gov.encrypted_payload_shape
          severity: high
          command: python3 checks/encrypted_payload_shape.py
        - id: gov.shape_contains_no_sensitive
          severity: high
          command: python3 checks/shape_contains_no_sensitive.py
        - id: gov.vocabulary_covers_shapes
          severity: high
          command: python3 checks/vocabulary_covers_shapes.py
        - id: gov.filled_question_never_sent
          severity: high
          command: python3 checks/filled_question_never_sent.py
        - id: gov.founder_gate
          severity: high
          command: python3 checks/founder_gate.py
        - id: gov.founder_token_not_repo
          severity: high
          command: python3 checks/founder_token_not_repo.py
      slow:
        - id: gov.waiting_well
          severity: medium
          command: python3 checks/waiting_well.py
        - id: gov.cannot_help_live
          severity: high
          command: >-
            curl -s -X POST http://localhost:3102/api/chat
            -H 'Content-Type: application/json'
            -d '{"message":"__probe_empty__"}'
            | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get('cannot_help') is True else 1)"
